<!DOCTYPE html>
<html>
<head><title>文章管理</title></head>
<body>
<h1>文章管理</h1>
<a href="{{ url_for('admin.new_article') }}">新建文章</a>
<table>
    <tr><th>标题</th><th>分类</th><th>状态</th><th>创建时间</th></tr>
    {% for article in pagination.items %}
    <tr>
        <td>{{ article.title }}</td>
        <td>{{ article.category.name if article.category else '无' }}</td>
        <td>{{ '已发布' if article.is_published else '草稿' }}</td>
        <td>{{ article.created_at.strftime('%Y-%m-%d') }}</td>
    </tr>
    {% endfor %}
</table>
</body>
</html>
